version: 2
project_name: tokfresh

builds:
  - id: tokfresh
    main: ./
    binary: tokfresh
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/stevejkang/tokfresh-cli/cmd.Version={{.Version}}
      - -X github.com/stevejkang/tokfresh-cli/cmd.Commit={{.ShortCommit}}
      - -X github.com/stevejkang/tokfresh-cli/cmd.Date={{.CommitDate}}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: unix
    ids: [tokfresh]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE*, README*]

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"

homebrew_casks:
  - name: tokfresh
    repository:
      owner: stevejkang
      name: homebrew-tap
      branch: main
    homepage: "https://github.com/stevejkang/tokfresh-cli"
    description: "Automate your Claude token reset timing via Cloudflare Workers"
    license: MIT
    commit_author:
      name: github-actions[bot]
      email: 41898282+github-actions[bot]@users.noreply.github.com
    skip_upload: auto # prereleases (v1.0.0-rc1) do not update the tap
    hooks:
      post:
        # The binary is not notarized; drop the quarantine flag so Gatekeeper lets it run.
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/tokfresh"]
          end

scoops:
  - name: tokfresh
    homepage: "https://github.com/stevejkang/tokfresh-cli"
    description: "Automate your Claude token reset timing via Cloudflare Workers"
    license: MIT
    repository:
      owner: stevejkang
      name: scoop-bucket
      branch: main
    commit_author:
      name: github-actions[bot]
      email: 41898282+github-actions[bot]@users.noreply.github.com
    skip_upload: auto

changelog:
  use: github
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]

release:
  prerelease: auto
